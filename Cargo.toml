[package]
name = "arbiter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local resource leases and collision detection for concurrent coding agents"
license = "MIT"

[[bin]]
name = "arbiter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
uuid = { version = "1.29", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
humantime = "2.4"
humantime-serde = "1.1"
signal-hook = "0.3"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = "symbols"
